name: Deploy Jo⚡Go Metric Jumps to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Stage both apps in one artifact: Jo⚡Go Metric Jumps stays at the
      # site root (its existing URL is unchanged) and Tick⚡Tock is served
      # alongside at /clock-go/. Both apps use only relative paths, so
      # subpath hosting works as-is.
      - name: Assemble site
        run: |
          mkdir -p _site/clock-go
          cp -r output/jo-go-metric-jumps/. _site/
          cp -r output/clock-go/. _site/clock-go/

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
